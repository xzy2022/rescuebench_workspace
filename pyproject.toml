[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["repos", "tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pylint.main]
py-version = "3.11"
ignore-paths = ["^repos[/\\\\]", "^tmp[/\\\\]"]
jobs = 1
persistent = false

[tool.pylint.format]
max-line-length = 88

[tool.pylint.reports]
reports = false
score = false
